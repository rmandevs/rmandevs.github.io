baseURL = "https://rmandevs.github.io/web/"
title = "RMN Devs"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
[pagination]
  pagerSize = 6
[languages]
  [languages.en]
    label = "English"
    locale = "en"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      tagline = "Small tools, agent skills and design systems. Built with personality by RMN Devs."
  [languages.es]
    label = "Español"
    locale = "es"
    contentDir = "content/es"
    weight = 2
    [languages.es.params]
      tagline = "Herramientas, skills para agentes y sistemas de diseño. Creados con personalidad por RMN Devs."
[params]
  github = "https://github.com/rmandevs"
  lofisons = "https://lofisons.com"
[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
[outputs]
  home = ["HTML", "RSS"]
