baseURL = "https://rmandevs.github.io/web/"
title = "RMN Devs"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
[pagination]
  pagerSize = 6
[languages]
  [languages.en]
    label = "English"
    locale = "en"
    contentDir = "content/en"
    weight = 1
    [languages.en.params]
      tagline = "Armando’s portfolio: open-source tools, agent skills and visual experiments."
  [languages.es]
    label = "Español"
    locale = "es"
    contentDir = "content/es"
    weight = 2
    [languages.es.params]
      tagline = "Portafolio de Armando: herramientas open source, skills para agentes y experimentos visuales."
[params]
  github = "https://github.com/rmandevs"
  lofisons = "https://lofisons.com"
[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
[outputs]
  home = ["HTML", "RSS"]
