<footer class="site-footer"><div class="footer-bottom wrap">
  <div class="footer-links">
    {{ if not .IsHome }}<a href="{{ site.Home.RelPermalink }}">{{ i18n "home" }}</a>{{ end }}
    <a href="{{ site.Params.github }}">GitHub ↗</a><a href="{{ site.Params.lofisons }}">lofisons ↗</a>
    <nav class="languages" aria-label="{{ i18n "language" }}">{{ range .AllTranslations }}<a href="{{ .RelPermalink }}" lang="{{ .Language.Lang }}" hreflang="{{ .Language.Lang }}" {{ if eq $.Language.Lang .Language.Lang }}aria-current="true"{{ end }}>{{ upper .Language.Lang }}</a>{{ end }}</nav>
  </div>
</div></footer>
