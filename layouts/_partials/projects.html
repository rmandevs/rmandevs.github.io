<div class="project-grid">{{ range $i, $p := (where site.RegularPages "Section" "projects").ByDate.Reverse }}<article class="project-card project-{{ .File.ContentBaseName }}"><a class="project-link" href="{{ .RelPermalink }}"><div class="project-visual"><div class="project-visual-top"><span>RMN / {{ printf "%02d" (add $i 1) }}</span><span>{{ .Params.language }}</span></div>{{ partial "artwork.html" . }}<span class="project-open" aria-hidden="true">↗</span><span class="visual-caption">{{ .Params.license }} / OPEN SOURCE</span></div><div class="project-info"><div><h3>{{ .Title }}</h3><span class="project-year">{{ .Date.Format "2006" }}</span></div><p>{{ .Params.summary }}</p></div></a></article>{{ end }}</div>
